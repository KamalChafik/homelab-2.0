- name: Deploy Portainer agent
  hosts: all
  become: true

  tasks:
    - name: Check Portainer agent path
      ansible.builtin.stat:
        path: /opt/portainer-agent
      register: portainer_agent_path

    - name: Remove invalid Portainer agent path
      ansible.builtin.file:
        path: /opt/portainer-agent
        state: absent
      when:
        - portainer_agent_path.stat.exists
        - not portainer_agent_path.stat.isdir

    - name: Ensure Portainer agent directory exists
      ansible.builtin.file:
        path: /opt/portainer-agent
        state: directory
        mode: "0755"

    - name: Copy Portainer agent compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/portainer-agent/docker-compose.yml"
        dest: /opt/portainer-agent/docker-compose.yml
        mode: "0644"
      register: portainer_agent_compose

    - name: Check if Portainer agent container exists
      community.docker.docker_container_info:
        name: portainer_agent
      register: portainer_agent_info
      failed_when: false

    - name: Deploy Portainer agent when needed
      community.docker.docker_compose_v2:
        project_src: /opt/portainer-agent
        state: present
        pull: missing
      when: portainer_agent_compose.changed or not portainer_agent_info.exists