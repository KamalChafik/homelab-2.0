- name: Check agents on VMs and sync Portainer environments
  hosts: all
  become: true
  gather_facts: false

  vars:
    portainer_agent_container_name: portainer_agent
    portainer_url: "{{ lookup('env', 'PORTAINER_URL') }}"
    portainer_api_key: "{{ lookup('env', 'PORTAINER_API_KEY') }}"

  tasks:
    - name: Check Portainer agent container info
      community.docker.docker_container_info:
        name: "{{ portainer_agent_container_name }}"
      register: portainer_agent_info
      failed_when: false

    - name: Fail if Portainer agent is not running
      ansible.builtin.fail:
        msg: "Portainer agent is not running on {{ inventory_hostname }}"
      when:
        - not portainer_agent_info.exists or
          not portainer_agent_info.container.State.Running

    - name: Get existing environments from Portainer
      ansible.builtin.uri:
        url: "{{ portainer_url }}/api/endpoints"
        method: GET
        headers:
          X-API-Key: "{{ portainer_api_key }}"
        validate_certs: false
        return_content: true
      register: portainer_envs
      delegate_to: localhost
      run_once: true
      become: false

    - name: Extract existing environment names
      ansible.builtin.set_fact:
        existing_env_names: "{{ portainer_envs.json | map(attribute='Name') | list }}"
      delegate_to: localhost
      run_once: true
      become: false

    - name: Create missing Portainer environments
      ansible.builtin.uri:
        url: "{{ portainer_url }}/api/endpoints"
        method: POST
        headers:
          X-API-Key: "{{ portainer_api_key }}"
        body_format: form-urlencoded
        body:
          Name: "{{ inventory_hostname }}"
          URL: "{{ ansible_host }}:9001"
          EndpointCreationType: 2
        validate_certs: false
        status_code: 200
      delegate_to: localhost
      become: false
      when: inventory_hostname not in hostvars[groups['all'][0]].existing_env_names