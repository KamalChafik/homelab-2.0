services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.04.1
    hostname: pihole
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"

    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      DNSMASQ_LISTENING: ${PIHOLE_DNSMASQ_LISTENING}

    volumes:
      - /opt/stacks/pihole/etc-pihole:/etc/pihole
      - /opt/stacks/pihole/etc-dnsmasq.d:/etc/dnsmasq.d

    dns:
      - ${UPSTREAM_DNS_1}
      - ${UPSTREAM_DNS_2}