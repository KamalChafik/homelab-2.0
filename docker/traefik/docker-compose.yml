services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
    
    dns:
      - 1.1.1.1
      - 1.0.0.1

    environment:
      CF_ZONE_API_TOKEN: ${CF_ZONE_API_TOKEN}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}

    volumes:
      - /mnt/apps/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /mnt/apps/traefik/dynamic:/etc/traefik/dynamic:ro
      - /mnt/apps/traefik/acme/acme.json:/etc/traefik/acme/acme.json